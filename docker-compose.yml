services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: misha
      POSTGRES_USER: misha
      POSTGRES_PASSWORD: misha-dev
    ports:
      - "5432:5432"
    volumes:
      - misha-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misha -d misha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  misha-postgres:
