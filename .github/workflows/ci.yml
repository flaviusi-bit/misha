name: CI

on:
  push:
    branches:
      - main
      - feature/eta-qr-verification
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Misha.slnx'
      - 'global.json'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/Dockerfile*'
      - 'NuGet.config'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Misha.slnx'
      - 'global.json'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/Dockerfile*'
      - 'NuGet.config'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Misha.slnx

      - name: Build
        run: dotnet build Misha.slnx --configuration Release --no-restore

      - name: Diagnose EF migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add EfDiagnostic --project src/Misha.Infrastructure --startup-project src/Misha.Api --output-dir /tmp/ef-diagnostic --no-build --verbose
          echo '--- GENERATED MIGRATION ---'
          cat /tmp/ef-diagnostic/*EfDiagnostic.cs
          echo '--- END GENERATED MIGRATION ---'

      - name: Test
        run: dotnet test Misha.slnx --configuration Release --no-build --verbosity normal

      - name: Build worker container
        run: docker build -f src/Misha.Worker/Dockerfile -t misha-worker-ci:${{ github.sha }} .

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/terraform-bootstrap
        run: terraform validate

# CI runs for application/container changes and workflow changes. Terraform-only changes are validated by the Terraform Plan workflow.
