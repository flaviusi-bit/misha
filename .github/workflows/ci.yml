name: CI

on:
  push:
    branches:
      - main
      - feature/eta-qr-verification
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Misha.slnx'
      - 'global.json'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/Dockerfile*'
      - 'NuGet.config'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Misha.slnx'
      - 'global.json'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/Dockerfile*'
      - 'NuGet.config'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Misha.slnx

      - name: Repair tenant migration metadata
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/tenant-isolation-bola'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f src/Misha.Infrastructure/Persistence/Migrations/20260830000000_AddApplicationTenantId.cs ]; then
            echo 'Tenant migration repair already completed.'
            exit 0
          fi
          cat > src/Misha.Infrastructure/MishaDbContextDesignTimeFactory.cs <<'EOF'
          using Microsoft.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore.Design;

          namespace Misha.Infrastructure.Persistence;

          public sealed class MishaDbContextDesignTimeFactory : IDesignTimeDbContextFactory<MishaDbContext>
          {
              public MishaDbContext CreateDbContext(string[] args)
              {
                  var options = new DbContextOptionsBuilder<MishaDbContext>()
                      .UseNpgsql("Host=localhost;Database=misha_design;Username=misha;Password=misha")
                      .Options;
                  return new MishaDbContext(options);
              }
          }
          EOF
          dotnet tool install --global dotnet-ef --version 10.0.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add TenantIsolation --project src/Misha.Infrastructure --startup-project src/Misha.Infrastructure --context MishaDbContext --output-dir Persistence/Migrations
          rm -f src/Misha.Infrastructure/Persistence/Migrations/20260830000000_AddApplicationTenantId.cs
          rm -f src/Misha.Infrastructure/Persistence/Migrations/20260830000001_AddApplicantTenantId.cs
          rm -f src/Misha.Infrastructure/MishaDbContextDesignTimeFactory.cs
          git add src/Misha.Infrastructure/Persistence/Migrations src/Misha.Infrastructure/MishaDbContextDesignTimeFactory.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: scaffold tenant migration metadata and snapshot'
          git push origin HEAD:${{ github.head_ref }}

      - name: Build
        run: dotnet build Misha.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Misha.slnx --configuration Release --no-build --verbosity normal

      - name: Build worker container
        run: docker build -f src/Misha.Worker/Dockerfile -t misha-worker-ci:${{ github.sha }} .

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: actions/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform bootstrap init
        working-directory: infrastructure/terraform-bootstrap
        run: terraform init

      - name: Terraform bootstrap validate
        working-directory: infrastructure/terraform-bootstrap
        run: terraform validate

# CI runs for application/container changes and workflow changes. Terraform-only changes are validated by the Terraform Plan workflow.