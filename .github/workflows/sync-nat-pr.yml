name: stage NAT migration

on:
  push:
    branches:
      - fix/nat-state-migration-az-keys-v2

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply NAT migration changes
        shell: python
        run: |
          from pathlib import Path

          main = Path("infrastructure/terraform/main.tf")
          text = main.read_text()

          old = '''locals {
            nat_by_index = {
              for i, az in local.azs : tostring(i) => az
            }
          }

          resource "aws_eip" "nat" {
            for_each = local.nat_by_index
            domain   = "vpc"
          }

          resource "aws_nat_gateway" "this" {
            for_each      = local.nat_by_index
            allocation_id = aws_eip.nat[each.key].id
            subnet_id     = aws_subnet.public[each.value].id
            depends_on    = [aws_internet_gateway.this]
          }

          resource "aws_route_table" "private" {
            for_each = local.nat_by_index
            vpc_id   = aws_vpc.this.id

            route {
              cidr_block     = "0.0.0.0/0"
              nat_gateway_id = aws_nat_gateway.this[each.key].id
            }
          }

          resource "aws_route_table_association" "private" {
            for_each       = aws_subnet.private
            subnet_id      = each.value.id
            route_table_id = aws_route_table.private[tostring(index(local.azs, each.key))].id
          }

          moved {
            from = aws_eip.nat
            to   = aws_eip.nat["0"]
          }

          moved {
            from = aws_nat_gateway.this
            to   = aws_nat_gateway.this["0"]
          }

          moved {
            from = aws_route_table.private
            to   = aws_route_table.private["0"]
          }
          '''

          new = '''locals {
            nat_azs = var.environment == "prod" ? local.azs : [local.azs[0]]
          }

          resource "aws_eip" "nat" {
            for_each = toset(local.nat_azs)
            domain   = "vpc"
          }

          resource "aws_nat_gateway" "this" {
            for_each      = toset(local.nat_azs)
            allocation_id = aws_eip.nat[each.key].id
            subnet_id     = aws_subnet.public[each.key].id
            depends_on    = [aws_internet_gateway.this]
          }

          resource "aws_route_table" "private" {
            for_each = toset(local.nat_azs)
            vpc_id   = aws_vpc.this.id

            route {
              cidr_block     = "0.0.0.0/0"
              nat_gateway_id = aws_nat_gateway.this[each.key].id
            }
          }

          resource "aws_route_table_association" "private" {
            for_each       = aws_subnet.private
            subnet_id      = each.value.id
            route_table_id = aws_route_table.private[var.environment == "prod" ? each.key : local.nat_azs[0]].id
          }

          # Preserve the historical singleton migration, then migrate the current
          # numeric for_each instances to stable Availability-Zone keys.
          moved {
            from = aws_eip.nat
            to   = aws_eip.nat["0"]
          }
          moved {
            from = aws_eip.nat["0"]
            to   = aws_eip.nat["eu-central-1a"]
          }
          moved {
            from = aws_eip.nat["1"]
            to   = aws_eip.nat["eu-central-1b"]
          }

          moved {
            from = aws_nat_gateway.this
            to   = aws_nat_gateway.this["0"]
          }
          moved {
            from = aws_nat_gateway.this["0"]
            to   = aws_nat_gateway.this["eu-central-1a"]
          }
          moved {
            from = aws_nat_gateway.this["1"]
            to   = aws_nat_gateway.this["eu-central-1b"]
          }

          moved {
            from = aws_route_table.private
            to   = aws_route_table.private["0"]
          }
          moved {
            from = aws_route_table.private["0"]
            to   = aws_route_table.private["eu-central-1a"]
          }
          moved {
            from = aws_route_table.private["1"]
            to   = aws_route_table.private["eu-central-1b"]
          }
          '''

          if old not in text:
              raise SystemExit("Expected NAT block not found")
          main.write_text(text.replace(old, new, 1))

          outputs = Path("infrastructure/terraform/outputs.tf")
          text = outputs.read_text()
          old = '''output "nat_gateway_id" {
            value = aws_nat_gateway.this["0"].id
          }
          '''
          new = '''output "nat_gateway_id" {
            value = aws_nat_gateway.this[local.nat_azs[0]].id
          }

          output "nat_gateway_ids" {
            description = "NAT Gateway IDs keyed by Availability Zone."
            value       = { for az, gateway in aws_nat_gateway.this : az => gateway.id }
          }
          '''
          if old not in text:
              raise SystemExit("Expected NAT output block not found")
          outputs.write_text(text.replace(old, new, 1))

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/terraform/main.tf infrastructure/terraform/outputs.tf
          git rm .github/workflows/sync-nat-pr.yml
          git commit -m "fix(nat): migrate numeric NAT state to AZ keys safely"
          git push origin HEAD:fix/nat-state-migration-az-keys-v2
