name: Security

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Misha.slnx'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'NuGet.config'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Misha.slnx'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'NuGet.config'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Misha.slnx

      - name: Build
        run: dotnet build Misha.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
