name: AWS Terraform Plan

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/aws-terraform-plan.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform refresh permissions
        shell: bash
        run: |
          set -euo pipefail

          ROLE_NAME="misha-dev-github-actions-deploy"
          POLICY_NAME="misha-dev-github-actions-cognito"
          RAW_POLICY_FILE="${RUNNER_TEMP}/cognito-policy-response.json"
          POLICY_FILE="${RUNNER_TEMP}/cognito-policy.json"

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --output json > "$RAW_POLICY_FILE"

          python3 - "$RAW_POLICY_FILE" "$POLICY_FILE" <<'PY'
          import json
          import sys
          import urllib.parse

          raw_path, policy_path = sys.argv[1:]
          with open(raw_path, encoding="utf-8") as handle:
              response = json.load(handle)

          document = response.get("PolicyDocument")
          if not document:
              raise SystemExit("IAM policy document was empty")

          if isinstance(document, str):
              document = urllib.parse.unquote(document)
              policy = json.loads(document)
          elif isinstance(document, dict):
              policy = document
          else:
              raise SystemExit(f"Unexpected IAM PolicyDocument type: {type(document).__name__}")

          action = "cognito-idp:GetUserPoolMfaConfig"
          statements = policy.setdefault("Statement", [])
          if isinstance(statements, dict):
              statements = [statements]
              policy["Statement"] = statements

          if not any(
              statement.get("Effect") == "Allow"
              and action in ([statement["Action"]] if isinstance(statement.get("Action"), str) else statement.get("Action", []))
              for statement in statements
          ):
              for statement in statements:
                  if statement.get("Effect") != "Allow":
                      continue
                  actions = statement.get("Action", [])
                  if isinstance(actions, str):
                      actions = [actions]
                      statement["Action"] = actions
                  actions.append(action)
                  break
              else:
                  statements.append({
                      "Effect": "Allow",
                      "Action": [action],
                      "Resource": "*",
                  })

          with open(policy_path, "w", encoding="utf-8") as handle:
              json.dump(policy, handle, separators=(",", ":"))
          PY

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"

          echo "Terraform refresh permission bootstrap complete."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -input=false
