name: AWS Terraform Plan

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/aws-terraform-plan.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform refresh permissions
        shell: bash
        run: |
          set -euo pipefail

          ROLE_NAME="misha-dev-github-actions-deploy"
          POLICY_NAME="misha-dev-github-actions-cognito"
          POLICY_FILE="${RUNNER_TEMP}/cognito-policy.json"

          python3 - <<'PY' > "${RUNNER_TEMP}/patch-policy.py"
          import json
          import sys
          import urllib.parse

          document = sys.stdin.read()
          policy = json.loads(urllib.parse.unquote(document))

          action = "cognito-idp:GetUserPoolMfaConfig"
          for statement in policy.get("Statement", []):
              actions = statement.get("Action", [])
              if isinstance(actions, str):
                  actions = [actions]
              if statement.get("Effect") == "Allow" and action in actions:
                  break
          else:
              policy["Statement"][0]["Action"].append(action)

          json.dump(policy, sys.stdout, separators=(",", ":"))
          PY

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query 'PolicyDocument' \
            --output text \
            | python3 "${RUNNER_TEMP}/patch-policy.py" > "$POLICY_FILE"

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"

          echo "Terraform refresh permission bootstrap complete."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -input=false
