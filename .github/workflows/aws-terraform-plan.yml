name: AWS Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/aws-terraform-plan.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Terraform environment to plan'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      domain_name:
        description: 'Production API domain name (required for prod)'
        required: false
        default: ''
        type: string
      route53_zone_id:
        description: 'Route53 hosted zone ID (required for prod)'
        required: false
        default: ''
        type: string
      final_snapshot_identifier:
        description: 'RDS final snapshot identifier (required for prod)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository/environment variable is not configured."
            exit 1
          }

      - name: Validate production inputs
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          DOMAIN_NAME: ${{ inputs.domain_name || '' }}
          ROUTE53_ZONE_ID: ${{ inputs.route53_zone_id || '' }}
          FINAL_SNAPSHOT_IDENTIFIER: ${{ inputs.final_snapshot_identifier || '' }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "prod" ]; then
            test -n "$DOMAIN_NAME" || { echo "Production requires domain_name."; exit 1; }
            test -n "$ROUTE53_ZONE_ID" || { echo "Production requires route53_zone_id."; exit 1; }
            test -n "$FINAL_SNAPSHOT_IDENTIFIER" || { echo "Production requires final_snapshot_identifier."; exit 1; }
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Terraform refreshes aws_backup_restore_testing_plan before it can
      # evaluate the managed policy that grants these permissions. Bootstrap
      # only the read actions needed for that refresh, then remove the temporary
      # inline policy after the plan. The permanent managed policy remains owned
      # by Terraform in backup-restore-iam.tf.
      - name: Bootstrap temporary restore testing read permissions
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-deploy"
          POLICY_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-restore-testing-refresh"
          cat > /tmp/restore-testing-refresh.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "backup:GetRestoreTestingPlan",
                  "backup:ListRestoreTestingPlans",
                  "backup:GetRestoreTestingSelection",
                  "backup:ListRestoreTestingSelections",
                  "backup:ListRestoreJobs"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document file:///tmp/restore-testing-refresh.json
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query 'PolicyName' \
            --output text
          sleep 10

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          DOMAIN_NAME: ${{ inputs.domain_name || '' }}
          ROUTE53_ZONE_ID: ${{ inputs.route53_zone_id || '' }}
          FINAL_SNAPSHOT_IDENTIFIER: ${{ inputs.final_snapshot_identifier || '' }}
        run: |
          set -euo pipefail
          PLAN_ARGS=(
            -input=false
            -var="environment=${TARGET_ENVIRONMENT}"
            -var="domain_name=${DOMAIN_NAME}"
            -var="route53_zone_id=${ROUTE53_ZONE_ID}"
            -var="final_snapshot_identifier=${FINAL_SNAPSHOT_IDENTIFIER}"
          )

          # PR plans must be non-mutating and cannot depend on IAM permissions
          # introduced by the same PR. For PR validation, disable state refresh
          # so Terraform can evaluate the proposed configuration without
          # requiring new AWS permissions to already exist.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PLAN_ARGS+=( -refresh=false )
          fi

          terraform plan "${PLAN_ARGS[@]}"

      - name: Remove temporary restore testing read permissions
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-deploy"
          POLICY_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-restore-testing-refresh"
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" || true
          if aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" >/dev/null 2>&1; then
            echo "ERROR: temporary restore testing refresh policy is still present."
            exit 1
          fi
