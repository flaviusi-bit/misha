name: AWS Terraform Plan

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/aws-terraform-plan.yml'
      - '.github/workflows/aws-terraform-apply.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform refresh permissions
        shell: bash
        run: |
          set -euo pipefail

          ROLE_NAME="misha-dev-github-actions-deploy"
          POLICY_NAME="misha-dev-github-actions-cognito"
          RAW_POLICY_FILE="${RUNNER_TEMP}/cognito-policy-response.json"
          POLICY_FILE="${RUNNER_TEMP}/cognito-policy.json"

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --output json > "$RAW_POLICY_FILE"

          python3 - "$RAW_POLICY_FILE" "$POLICY_FILE" <<'PY'
          import json
          import sys
          import urllib.parse

          raw_path, policy_path = sys.argv[1:]
          with open(raw_path, encoding="utf-8") as handle:
              response = json.load(handle)

          document = response.get("PolicyDocument")
          if not document:
              raise SystemExit("IAM policy document was empty")

          def parse_policy_document(value):
              if isinstance(value, dict):
                  return value
              if not isinstance(value, str):
                  raise SystemExit(
                      f"Unexpected IAM PolicyDocument type: {type(value).__name__}"
                  )

              candidates = [value]
              decoded = urllib.parse.unquote(value)
              if decoded != value:
                  candidates.append(decoded)

              last_error = None
              for candidate in candidates:
                  try:
                      parsed = json.loads(candidate)
                  except json.JSONDecodeError as exc:
                      last_error = exc
                      continue

                  if isinstance(parsed, dict):
                      return parsed

                  if isinstance(parsed, str):
                      try:
                          nested = json.loads(parsed)
                      except json.JSONDecodeError as exc:
                          last_error = exc
                          continue
                      if isinstance(nested, dict):
                          return nested

              raise SystemExit(
                  f"Unable to parse IAM PolicyDocument as JSON: {last_error}"
              )

          policy = parse_policy_document(document)

          required_actions = {
              "cognito-idp:GetUserPoolMfaConfig",
              "cognito-idp:GetGroup",
              "cognito-idp:CreateGroup",
              "cognito-idp:DeleteGroup",
              "cognito-idp:UpdateGroup",
          }

          statements = policy.setdefault("Statement", [])
          if isinstance(statements, dict):
              statements = [statements]
              policy["Statement"] = statements

          allow_statements = [
              statement
              for statement in statements
              if statement.get("Effect") == "Allow"
          ]

          if not allow_statements:
              statements.append({
                  "Effect": "Allow",
                  "Action": sorted(required_actions),
                  "Resource": "*",
              })
          else:
              actions = allow_statements[0].get("Action", [])
              if isinstance(actions, str):
                  actions = [actions]
                  allow_statements[0]["Action"] = actions

              missing = required_actions.difference(actions)
              if missing:
                  actions.extend(sorted(missing))

          with open(policy_path, "w", encoding="utf-8") as handle:
              json.dump(policy, handle, separators=(",", ":"))
          PY

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"

          echo "Terraform refresh permission bootstrap complete."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -input=false
