name: AWS Terraform Plan

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/aws-terraform-plan.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform refresh permissions
        shell: bash
        run: |
          set -euo pipefail

          ROLE_NAME="misha-dev-github-actions-deploy"
          POLICY_NAME="misha-dev-github-actions-cognito"
          POLICY_FILE="${RUNNER_TEMP}/cognito-policy.json"

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query 'PolicyDocument' \
            --output text \
            | python3 -c '
          import json
          import sys
          import urllib.parse

          document = sys.stdin.read()
          if not document.strip():
              raise SystemExit("IAM policy document was empty")

          policy = json.loads(urllib.parse.unquote(document))
          action = "cognito-idp:GetUserPoolMfaConfig"

          statements = policy.setdefault("Statement", [])
          if isinstance(statements, dict):
              statements = [statements]
              policy["Statement"] = statements

          for statement in statements:
              actions = statement.get("Action", [])
              if isinstance(actions, str):
                  actions = [actions]
              if statement.get("Effect") == "Allow" and action in actions:
                  break
          else:
              for statement in statements:
                  actions = statement.get("Action", [])
                  if statement.get("Effect") == "Allow":
                      if isinstance(actions, str):
                          actions = [actions]
                          statement["Action"] = actions
                      actions.append(action)
                      break
              else:
                  statements.append({"Effect": "Allow", "Action": [action], "Resource": "*"})

          json.dump(policy, sys.stdout, separators=(",", ":"))
          ' > "$POLICY_FILE"

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document "file://$POLICY_FILE"

          echo "Terraform refresh permission bootstrap complete."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -input=false
