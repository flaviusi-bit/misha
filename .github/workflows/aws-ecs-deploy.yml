name: AWS ECS Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Misha.slnx'
      - 'global.json'
      - 'src/Misha.Api/Dockerfile'
      - '.github/workflows/aws-ecs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: misha-dev-api
  ECS_CLUSTER: misha-dev
  ECS_SERVICE: misha-dev-api
  ECS_TASK_DEFINITION: misha-dev-api
  CONTAINER_NAME: api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: arn:aws:iam::576984879588:role/misha-dev-github-actions-deploy
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::576984879588:role/misha-dev-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR registry
        id: registry
        run: echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f src/Misha.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Inject database secrets into ECS task definition
        run: |
          DB_SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier misha-dev \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)

          test -n "$DB_SECRET_ARN" && test "$DB_SECRET_ARN" != "None" || {
            echo "RDS managed master secret ARN was not found."
            exit 1
          }

          jq --arg secret "$DB_SECRET_ARN" \
            '.containerDefinitions |= map(if .name == "api" then .secrets = [
              {name:"DB_HOST", valueFrom:($secret + ":host::")},
              {name:"DB_PORT", valueFrom:($secret + ":port::")},
              {name:"DB_NAME", valueFrom:($secret + ":dbname::")},
              {name:"DB_USER", valueFrom:($secret + ":username::")},
              {name:"DB_PASSWORD", valueFrom:($secret + ":password::")}
            ] else . end)' \
            task-definition.json > task-definition.with-secrets.json

          mv task-definition.with-secrets.json task-definition.json
          echo "Injected RDS secret reference into ECS task definition."

      - name: Render ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployed service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,running:runningCount,desired:desiredCount,taskDefinition:taskDefinition}' \
            --output table
