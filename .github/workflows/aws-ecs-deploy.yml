name: AWS ECS Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Misha.slnx'
      - 'global.json'
      - 'src/Misha.Api/Dockerfile'
      - '.github/workflows/aws-ecs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ecs-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: misha-dev-api
  ECS_CLUSTER: misha-dev
  ECS_SERVICE: misha-dev-api
  ECS_TASK_DEFINITION: misha-dev-api
  CONTAINER_NAME: api
  COGNITO_USER_POOL_NAME: dev-misha
  COGNITO_API_IDENTIFIER: https://misha-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository/environment variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsECSDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR registry
        id: registry
        run: echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f src/Misha.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Materialize Cognito authentication configuration
        run: |
          set -euo pipefail

          USER_POOL_ID=$(aws cognito-idp list-user-pools \
            --max-results 60 \
            --query "UserPools[?Name=='${COGNITO_USER_POOL_NAME}'].Id | [0]" \
            --output text)

          test -n "$USER_POOL_ID" && test "$USER_POOL_ID" != "None" || {
            echo "Cognito user pool '$COGNITO_USER_POOL_NAME' was not found."
            exit 1
          }

          AUTHORITY="https://cognito-idp.${AWS_REGION}.amazonaws.com/${USER_POOL_ID}"

          aws cognito-idp describe-resource-server \
            --user-pool-id "$USER_POOL_ID" \
            --identifier "$COGNITO_API_IDENTIFIER" >/dev/null

          jq --arg authority "$AUTHORITY" \
             --arg audience "$COGNITO_API_IDENTIFIER" \
             --arg apiIdentifier "$COGNITO_API_IDENTIFIER" \
             '.containerDefinitions |= map(if .name == "api" then .environment = ((.environment // []) | map(select(.name != "Authentication__Authority" and .name != "Authentication__Audience" and .name != "Authentication__ApiIdentifier")) + [{name:"Authentication__Authority",value:$authority},{name:"Authentication__Audience",value:$audience},{name:"Authentication__ApiIdentifier",value:$apiIdentifier}]) else . end)' \
             task-definition.json > task-definition.auth.json

          mv task-definition.auth.json task-definition.json

          jq -e '.containerDefinitions[] | select(.name == "api") | any(.environment[]?; .name == "Authentication__Authority" and (.value | length > 0))' task-definition.json >/dev/null
          jq -e '.containerDefinitions[] | select(.name == "api") | any(.environment[]?; .name == "Authentication__Audience" and (.value | length > 0))' task-definition.json >/dev/null

          echo "Cognito authentication configuration is present in the task definition."

      - name: Render ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Capture ECS deployment diagnostics
        if: always()
        run: |
          echo '=== ECS SERVICE ==='
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,running:runningCount,desired:desiredCount,pending:pendingCount,taskDefinition:taskDefinition,deployments:deployments[*].{status:status,rolloutState:rolloutState,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks,taskDefinition:taskDefinition},events:events[0:15].message}' \
            --output json

          echo '=== RECENT STOPPED TASKS ==='
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status STOPPED \
            --max-results 10 \
            --query 'taskArns' \
            --output text)

          if [ -n "$TASK_ARNS" ]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks $TASK_ARNS \
              --query 'tasks[*].{task:taskArn,lastStatus:lastStatus,desiredStatus:desiredStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json
          else
            echo 'No stopped tasks returned.'
          fi

      - name: Verify deployed service
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,running:runningCount,desired:desiredCount,taskDefinition:taskDefinition}' \
            --output table
