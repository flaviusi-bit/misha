name: repair-nat-migration
on:
  push:
    branches: [fix/nat-state-migration-az-keys]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repair moved blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('infrastructure/terraform/main.tf')
          s = p.read_text()
          old = '''moved {
            from = aws_eip.nat
            to   = aws_eip.nat["eu-central-1a"]
          }

          moved {
            from = aws_nat_gateway.this
            to   = aws_nat_gateway.this["eu-central-1a"]
          }

          moved {
            from = aws_route_table.private
            to   = aws_route_table.private["eu-central-1a"]
          }
          '''
          new = '''# Preserve the historical singleton migration, then migrate the current
          # numeric for_each instances to stable Availability-Zone keys.
          moved {
            from = aws_eip.nat
            to   = aws_eip.nat["0"]
          }
          moved {
            from = aws_eip.nat["0"]
            to   = aws_eip.nat["eu-central-1a"]
          }
          moved {
            from = aws_eip.nat["1"]
            to   = aws_eip.nat["eu-central-1b"]
          }

          moved {
            from = aws_nat_gateway.this
            to   = aws_nat_gateway.this["0"]
          }
          moved {
            from = aws_nat_gateway.this["0"]
            to   = aws_nat_gateway.this["eu-central-1a"]
          }
          moved {
            from = aws_nat_gateway.this["1"]
            to   = aws_nat_gateway.this["eu-central-1b"]
          }

          moved {
            from = aws_route_table.private
            to   = aws_route_table.private["0"]
          }
          moved {
            from = aws_route_table.private["0"]
            to   = aws_route_table.private["eu-central-1a"]
          }
          moved {
            from = aws_route_table.private["1"]
            to   = aws_route_table.private["eu-central-1b"]
          }
          '''
          if old not in s:
              raise SystemExit('Expected PR97 moved-block section not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infrastructure/terraform/main.tf
          git commit -m "fix(nat): correct AZ state migration addresses"
          git rm .github/workflows/repair-nat-migration.yml
          git commit -m "chore: remove temporary NAT repair workflow"
          git push
