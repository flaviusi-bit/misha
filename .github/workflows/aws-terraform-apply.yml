name: AWS Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to apply"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm:
        description: "Type APPLY to authorize the Terraform apply"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-terraform-apply-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Require main branch
        working-directory: .
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "ERROR: AWS Terraform Apply must be dispatched from main."
            echo "Selected ref: $GITHUB_REF"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository/environment variable is not configured."
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformApply

      - name: Verify AWS identity
        working-directory: .
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        run: terraform init

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: terraform plan -input=false -var="environment=${TARGET_ENVIRONMENT}" -out=tfplan

      - name: Terraform apply approved plan
        run: terraform apply -input=false tfplan

      - name: Verify managed application secret exists
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          SECRET_NAME="misha-${TARGET_ENVIRONMENT}/application"
          aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query '{ARN:ARN,Name:Name}' \
            --output table

      - name: Verify ECS execution policy references application secret
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-ecs-execution"
          POLICY_NAME="misha-${TARGET_ENVIRONMENT}-ecs-execution-secrets"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query 'PolicyDocument.Statement[0].Resource' \
            --output json

      - name: Verify Terraform state is clean
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: terraform plan -input=false -var="environment=${TARGET_ENVIRONMENT}" -detailed-exitcode
