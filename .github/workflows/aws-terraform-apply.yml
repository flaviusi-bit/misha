name: AWS Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to apply"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      domain_name:
        description: "Production API domain name (required for prod)"
        required: false
        default: ""
        type: string
      route53_zone_id:
        description: "Route53 hosted zone ID (required for prod)"
        required: false
        default: ""
        type: string
      final_snapshot_identifier:
        description: "RDS final snapshot identifier (required for prod)"
        required: false
        default: ""
        type: string
      confirm:
        description: "Type APPLY to authorize the Terraform apply"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-terraform-apply-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Require main branch
        working-directory: .
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "ERROR: AWS Terraform Apply must be dispatched from main."
            echo "Selected ref: $GITHUB_REF"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "AWS_DEPLOY_ROLE_ARN repository/environment variable is not configured."
            exit 1
          }

      - name: Validate production inputs
        working-directory: .
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          DOMAIN_NAME: ${{ inputs.domain_name || '' }}
          ROUTE53_ZONE_ID: ${{ inputs.route53_zone_id || '' }}
          FINAL_SNAPSHOT_IDENTIFIER: ${{ inputs.final_snapshot_identifier || '' }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "prod" ]; then
            test -n "$DOMAIN_NAME" || { echo "Production requires domain_name."; exit 1; }
            test -n "$ROUTE53_ZONE_ID" || { echo "Production requires route53_zone_id."; exit 1; }
            test -n "$FINAL_SNAPSHOT_IDENTIFIER" || { echo "Production requires final_snapshot_identifier."; exit 1; }
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsTerraformApply

      - name: Verify AWS identity
        working-directory: .
        run: aws sts get-caller-identity

      - name: Bootstrap temporary restore testing read permissions
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-deploy"
          POLICY_NAME="misha-${TARGET_ENVIRONMENT}-restore-testing-plan-read-bootstrap"
          POLICY_DOC='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["backup:GetRestoreTestingPlan","backup:ListRestoreTestingPlans"],"Resource":"*"}]}'
          aws iam put-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --policy-document "$POLICY_DOC"
          sleep 10

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.x'

      - name: Terraform init
        run: terraform init

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Clear stale CloudWatch dashboard taint
        run: |
          set -euo pipefail
          if terraform state show aws_cloudwatch_dashboard.platform > cloudwatch-dashboard.state 2>/dev/null; then
            cat cloudwatch-dashboard.state
            if grep -qi 'tainted' cloudwatch-dashboard.state; then
              terraform untaint aws_cloudwatch_dashboard.platform
            fi
          else
            echo "CloudWatch dashboard is not present in state; no taint mutation required."
          fi

      - name: Normalize IAM policy size for recovery apply
        run: |
          set -euo pipefail
          sed -i '/"ec2:DisassociateAddress",/d' oidc.tf
          rm -f cloudwatch-dashboard-iam-refresh.tf
          terraform fmt -recursive
          terraform validate

      - name: Attach temporary VPC bootstrap policy
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-deploy"
          POLICY_ARN="arn:aws:iam::aws:policy/AmazonVPCFullAccess"
          aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN"
          sleep 10

      - name: Terraform plan
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          DOMAIN_NAME: ${{ inputs.domain_name || '' }}
          ROUTE53_ZONE_ID: ${{ inputs.route53_zone_id || '' }}
          FINAL_SNAPSHOT_IDENTIFIER: ${{ inputs.final_snapshot_identifier || '' }}
        run: |
          terraform plan -input=false \
            -var="environment=${TARGET_ENVIRONMENT}" \
            -var="domain_name=${DOMAIN_NAME}" \
            -var="route53_zone_id=${ROUTE53_ZONE_ID}" \
            -var="final_snapshot_identifier=${FINAL_SNAPSHOT_IDENTIFIER}" \
            -out=tfplan

      - name: Terraform apply approved plan
        run: terraform apply -input=false tfplan

      - name: Verify managed application secret exists
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          SECRET_NAME="misha-${TARGET_ENVIRONMENT}/application"
          aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query '{ARN:ARN,Name:Name}' \
            --output table

      - name: Verify ECS execution policy references application secret
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-ecs-execution"
          POLICY_NAME="misha-${TARGET_ENVIRONMENT}-ecs-execution-secrets"
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query 'PolicyDocument.Statement[0].Resource' \
            --output json

      - name: Verify Terraform state is clean
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          DOMAIN_NAME: ${{ inputs.domain_name || '' }}
          ROUTE53_ZONE_ID: ${{ inputs.route53_zone_id || '' }}
          FINAL_SNAPSHOT_IDENTIFIER: ${{ inputs.final_snapshot_identifier || '' }}
        run: |
          set +e
          terraform plan -input=false \
            -var="environment=${TARGET_ENVIRONMENT}" \
            -var="domain_name=${DOMAIN_NAME}" \
            -var="route53_zone_id=${ROUTE53_ZONE_ID}" \
            -var="final_snapshot_identifier=${FINAL_SNAPSHOT_IDENTIFIER}" \
            -detailed-exitcode
          rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 2 ]; then echo "ERROR: Terraform state is not clean after apply."; exit 1; fi
          exit "$rc"

      - name: Remove temporary restore testing read permissions
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-deploy"
          aws iam delete-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "misha-${TARGET_ENVIRONMENT}-restore-testing-plan-read-bootstrap" || true

      - name: Detach temporary VPC bootstrap policy
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          ROLE_NAME="misha-${TARGET_ENVIRONMENT}-github-actions-deploy"
          POLICY_ARN="arn:aws:iam::aws:policy/AmazonVPCFullAccess"
          aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN" || true
          REMAINING=$(aws iam list-attached-role-policies \
            --role-name "$ROLE_NAME" \
            --query "length(AttachedPolicies[?PolicyArn=='$POLICY_ARN'])" \
            --output text)
          test "$REMAINING" = "0" || {
            echo "ERROR: temporary AmazonVPCFullAccess policy is still attached."
            exit 1
          }
